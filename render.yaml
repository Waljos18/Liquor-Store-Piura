# Blueprint de Render para el backend (Spring Boot en Docker).
# El frontend se despliega aparte en Vercel (Root Directory = frontend).
#
# Las variables con "sync: false" se piden al crear el servicio en Render.
services:
  - type: web
    name: chilalo-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    # free: se duerme tras 15 min sin uso (el primer request tarda ~1 min).
    # Para operar la tienda a diario conviene "starter" (siempre encendido).
    plan: free
    region: virginia
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: cloud
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USER
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
