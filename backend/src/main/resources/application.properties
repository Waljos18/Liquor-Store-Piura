# Server (0.0.0.0 = acepta conexiones desde la LAN, no solo desde la misma PC)
server.address=0.0.0.0
server.port=8080
spring.application.name=licoreria-backend

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/licoreria_db
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
# Nunca permitir que Flyway borre la base de datos (protege ventas, clientes, etc.)
spring.flyway.clean-disabled=true

# JWT
jwt.secret=licoreria-piura-2025-secret-key-cambiar-en-produccion-min-256bits
jwt.expiration=3600000
jwt.refresh-expiration=86400000

# CORS
# Patrones: localhost + cualquier IP de redes privadas (la IP de la LAN cambia según la red)
cors.allowed-origins=http://localhost:*,http://127.0.0.1:*,http://10.*.*.*:*,http://192.168.*.*:*

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Logging
logging.level.com.licoreria=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO

# Email (SMTP) - Recuperación de contraseña
# Para Gmail: activar "Contraseñas de aplicación" en tu cuenta Google
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=walterhidalgom1@gmail.com
spring.mail.password=TU_CONTRASENA_DE_APLICACION
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000

# URL del frontend (para generar el link del email)
app.frontend-url=http://localhost:5173

