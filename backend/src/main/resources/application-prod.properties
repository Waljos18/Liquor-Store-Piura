# Producción - valores por defecto del perfil "prod".
# Los datos propios de cada instalación (BD, JWT secret, IP) van en
# C:\Chilalo\config\application-prod.properties, que sobreescribe este archivo.
spring.jpa.show-sql=false
logging.level.com.licoreria=INFO
logging.level.org.springframework.security=WARN

# Logs a archivo con rotación (10 MB por archivo, 30 días)
logging.file.name=logs/backend.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30

# Sin documentación Swagger en producción
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Frontend servido por el backend (FrontendConfig)
app.frontend-dir=file:web/
