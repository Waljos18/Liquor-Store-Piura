# Nube - perfil "cloud" (backend en Render/Railway + frontend en Vercel).
# Todos los datos sensibles llegan por variables de entorno del proveedor;
# si falta una obligatoria (BD, JWT_SECRET, CORS) el backend no arranca.

# El proveedor asigna el puerto por la variable PORT
server.port=${PORT:8080}
# Detrás del proxy HTTPS del proveedor
server.forward-headers-strategy=framework

# Database (p. ej. Neon: jdbc:postgresql://<host>/<db>?sslmode=require)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
# Los planes gratuitos de PostgreSQL limitan las conexiones
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

spring.jpa.show-sql=false

# JWT (mínimo 32 caracteres aleatorios)
jwt.secret=${JWT_SECRET}

# CORS: solo el dominio del frontend en Vercel (separar con comas si hay varios)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# URL del frontend (para el link del email de recuperación de contraseña)
app.frontend-url=${FRONTEND_URL}

# Email (SMTP) - opcional; sin estas variables la recuperación de contraseña no envía correos
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

# SUNAT OSE - opcional
sunat.ose.usuario=${SUNAT_OSE_USUARIO:}
sunat.ose.password=${SUNAT_OSE_PASSWORD:}
sunat.ose.ambiente=${SUNAT_OSE_AMBIENTE:pruebas}

logging.level.com.licoreria=INFO
logging.level.org.springframework.security=WARN

# Sin documentación Swagger en producción
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
